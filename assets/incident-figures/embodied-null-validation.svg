<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Embodied incident cross-domain mapping compared with a shuffled null</title>
<desc id="desc">Observed cross-domain mapping is 52.3 percent, compared with a null mean of 27.0 percent and a null 95th percentile of 28.9 percent.</desc>
<style>text{font-family:Arial,sans-serif;fill:#172a46;font-size:18px}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="55" y="42" font-size="27" font-weight="700">Embodied incidents cross HEART domains more often than shuffled mappings</text>
<text x="55" y="72" fill="#667085">Share with at least two HEART L1 domains; higher values mean more cross-domain activation</text>
<line x1="210.0" y1="67" x2="210.0" y2="285" stroke="#dde3ea"/><text x="210.0" y="315" text-anchor="middle">0%</text><line x1="330.0" y1="67" x2="330.0" y2="285" stroke="#dde3ea"/><text x="330.0" y="315" text-anchor="middle">10%</text><line x1="450.0" y1="67" x2="450.0" y2="285" stroke="#dde3ea"/><text x="450.0" y="315" text-anchor="middle">20%</text><line x1="570.0" y1="67" x2="570.0" y2="285" stroke="#dde3ea"/><text x="570.0" y="315" text-anchor="middle">30%</text><line x1="690.0" y1="67" x2="690.0" y2="285" stroke="#dde3ea"/><text x="690.0" y="315" text-anchor="middle">40%</text><line x1="810.0" y1="67" x2="810.0" y2="285" stroke="#dde3ea"/><text x="810.0" y="315" text-anchor="middle">50%</text><line x1="930.0" y1="67" x2="930.0" y2="285" stroke="#dde3ea"/><text x="930.0" y="315" text-anchor="middle">60%</text><text x="192" y="108" text-anchor="end">Observed embodied subset</text><rect x="210" y="87" width="627.7" height="30" fill="#d84a4a" rx="2"/><text x="849.7" y="108" font-weight="700">52.3%</text><text x="192" y="183" text-anchor="end">Null mean</text><rect x="210" y="162" width="324.3" height="30" fill="#5b88b5" rx="2"/><text x="546.3" y="183" font-weight="700">27.0%</text><text x="192" y="258" text-anchor="end">Null 95th percentile</text><rect x="210" y="237" width="346.4" height="30" fill="#163b70" rx="2"/><text x="568.4" y="258" font-weight="700">28.9%</text>
<text x="210" y="402" fill="#667085">2,000 rank × cosine-decile permutations; one-sided p = 0.0005</text>
</svg>